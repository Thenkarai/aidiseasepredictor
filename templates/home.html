<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AgroAI — Botanical Diagnostics & Digital Twin Dashboard.">
    <title>AgroAI Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
    <style>
        #analysis-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95); z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
        }
        .view-section { display: none; width: 100%; animation: fadeIn 0.5s ease; }
        .view-active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        #camera-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 10001; display: none;
            align-items: center; justify-content: center; flex-direction: column; gap: 30px;
        }
        #camera-video { width: 90%; max-width: 800px; border-radius: 20px; border: 4px solid #fff; }
    </style>
</head>
<body>

    <nav class="top-navbar">
        <div class="nav-brand">
            <i class="fas fa-leaf"></i>
            <span>AgroAI</span>
        </div>
        <div class="nav-menu">
            <a href="javascript:void(0)" onclick="switchView('dashboard')" class="menu-item active" id="menu-dash">Dashboard</a>
            <a href="javascript:void(0)" onclick="switchView('analytics')" class="menu-item" id="menu-analytics">Analytics</a>
        </div>
        <div class="nav-right">
             <!-- Minimal Profile -->
             <div style="width:40px; height:40px; border-radius:10px; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; color:#fff;">
                <i class="fas fa-user"></i>
             </div>
        </div>
    </nav>

    <div id="camera-modal">
        <video id="camera-video" autoplay playsinline></video>
        <div style="display:flex; gap:20px;">
            <button class="scanner-btn" onclick="capturePhoto()"><i class="fas fa-camera"></i> CAPTURE</button>
            <button class="scanner-btn-alt" onclick="closeCamera()">CANCEL</button>
        </div>
        <canvas id="camera-canvas" style="display:none;"></canvas>
    </div>

    <div id="analysis-loader">
        <i class="fas fa-spinner fa-spin" style="font-size:48px; color:var(--accent);"></i>
        <p style="font-weight:700;">Processing Specimen...</p>
    </div>

    <div class="main-wrapper">
        <div id="view-dashboard" class="view-section view-active">
            <div class="header-hero">
                <h1 class="overview-title">Digital Twin</h1>
                <div class="top-metrics">
                    <div class="metric-item">
                        <span><i class="fas fa-droplet"></i> Hydration</span>
                        <span>82%</span>
                    </div>
                    <div class="metric-item">
                        <span><i class="fas fa-flask"></i> Soil pH</span>
                        <span>6.8</span>
                    </div>
                    <div class="metric-item">
                        <span><i class="fas fa-temperature-half"></i> Core Temp</span>
                        <span>24°C</span>
                    </div>
                </div>

                <div class="plant-visual-hub">
                    <img src="https://github.com/Thenkarai/aidiseasepredictor/raw/main/static/images/botanical_anatomy.png" class="plant-anatomy-img" alt="Plant Twin">
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="card-v3" style="grid-column: span 2; display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <h2 style="font-size:1.8rem; font-weight:700;">Diagnostic Hub</h2>
                        <p style="color:var(--text-secondary);">Initialize camera or upload specimen.</p>
                    </div>
                    <div style="display:flex; gap:15px;">
                        <button class="scanner-btn" onclick="openCamera()"><i class="fas fa-video"></i> CAMERA</button>
                        <button class="scanner-btn-alt" onclick="document.getElementById('file-input').click()"><i class="fas fa-upload"></i> FILE</button>
                    </div>
                </div>

                <div class="card-v3">
                    <div class="card-title">AI System</div>
                    <div style="padding:15px; background:#f8fafc; border-radius:12px; border:1px solid #e2e8f0; color:var(--accent); font-weight:700; display:flex; align-items:center; gap:10px;">
                        <span style="width:10px; height:10px; border-radius:50%; background:var(--accent);"></span>
                        SYSTEM ACTIVE
                    </div>
                </div>
            </div>

            <section class="containers-section">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
                    <h2 style="font-size:1.5rem; font-weight:700;">Active Containers</h2>
                </div>
                <table class="c-table">
                    <thead>
                        <tr>
                            <th>Unit UUID</th>
                            <th>Health status</th>
                            <th>Time</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="container-body"></tbody>
                </table>
            </section>
        </div>

        <div id="view-analysis" class="view-section">
             <div id="report-view"></div>
        </div>

        <input type="file" id="file-input" onchange="handleFileSelect(event)" hidden>
    </div>

    <script>
        let stream = null;
        async function openCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                document.getElementById('camera-video').srcObject = stream;
                document.getElementById('camera-modal').style.display = 'flex';
            } catch (err) { alert(err.message); }
        }
        function closeCamera() { if (stream) stream.getTracks().forEach(t => t.stop()); document.getElementById('camera-modal').style.display='none'; }
        async function capturePhoto() {
            const v = document.getElementById('camera-video');
            const c = document.getElementById('camera-canvas');
            c.width = v.videoWidth; c.height = v.videoHeight;
            c.getContext('2d').drawImage(v,0,0);
            c.toBlob(b => handleDiagnosis(new File([b], "cap.jpg", {type:"image/jpeg"})), 'image/jpeg', 0.9);
            closeCamera();
        }
        async function handleDiagnosis(f) {
            document.getElementById('analysis-loader').style.display = 'flex';
            const fd = new FormData(); fd.append('img', f);
            try {
                const r = await fetch('/upload/', { method: 'POST', body: fd, headers: {'X-Requested-With':'XMLHttpRequest'}});
                const d = await r.json();
                if (d.success) { saveToTwin(d); updateUI(d); }
            } catch (e) { alert(e); }
            finally { document.getElementById('analysis-loader').style.display='none'; }
        }
        function handleFileSelect(e) { if(e.target.files[0]) handleDiagnosis(e.target.files[0]); }
        function switchView(v) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('view-active'));
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            if(v === 'dashboard') { document.getElementById('view-dashboard').classList.add('view-active'); document.getElementById('menu-dash').classList.add('active'); }
            else if(v === 'analysis') { document.getElementById('view-analysis').classList.add('view-active'); }
            window.scrollTo({top:0, behavior:'smooth'});
        }
        function renderContainers() {
            const h = JSON.parse(localStorage.getItem('agro-twin-containers') || '[]');
            document.getElementById('container-body').innerHTML = h.map((item, idx) => `
                <tr>
                    <td>#${1000+idx}</td>
                    <td style="color:${item.disease_name==='Healthy'?'var(--accent)':'#ef4444'}; font-weight:700;">${item.disease_name}</td>
                    <td style="opacity:0.6;">${item.current_time||'Now'}</td>
                    <td>ACTIVE</td>
                    <td><button onclick="loadFromArchive(${idx})" style="background:var(--accent); color:#fff; border:none; padding:8px 15px; border-radius:8px; cursor:pointer;">VIEW</button></td>
                </tr>
            `).join('');
        }
        function saveToTwin(d) { let h = JSON.parse(localStorage.getItem('agro-twin-containers') || '[]'); h.unshift(d); localStorage.setItem('agro-twin-containers', JSON.stringify(h.slice(0,20))); renderContainers(); }
        function updateUI(d) {
            document.getElementById('report-view').innerHTML = `
                <div style="background:#fff; border-radius:24px; padding:40px; box-shadow:var(--card-shadow); margin-top:40px;">
                    <button onclick="switchView('dashboard')" style="background:#f1f5f9; border:none; padding:10px 20px; border-radius:10px; cursor:pointer; font-weight:700;">← BACK</button>
                    <div style="display:grid; grid-template-columns: 1fr 1.5fr; gap:60px; margin-top:30px;">
                        <img src="${d.imagepath}" style="width:100%; border-radius:20px;">
                        <div>
                            <h2 style="font-size:2.5rem;">${d.plant_name}</h2>
                            <h3 style="color:${d.disease_name==='Healthy'?'var(--accent)':'#ef4444'};">${d.disease_name}</h3>
                            <div style="margin-top:30px;">
                                <h4 style="color:var(--accent);">Cause</h4><p>${d.prediction.cause}</p>
                                <h4 style="color:var(--accent); margin-top:20px;">Cure</h4><p>${d.prediction.cure}</p>
                            </div>
                        </div>
                    </div>
                </div>`;
            switchView('analysis');
        }
        function loadFromArchive(i) { updateUI(JSON.parse(localStorage.getItem('agro-twin-containers'))[i]); }
        renderContainers();
    </script>
</body>
</html>
